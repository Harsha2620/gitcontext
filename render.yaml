services:
  - type: web
    name: gitcontext
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt && python -m app.cli index https://github.com/pallets/flask --max-commits 200 && rm -rf data/repos
    startCommand: uvicorn app.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: EMBED_BACKEND
        value: fastembed
      - key: FASTEMBED_CACHE_PATH
        value: .cache/fastembed
      - key: DISABLE_RERANK
        value: "1"
      - key: RATE_LIMIT_PER_MIN
        value: "6"
      - key: DAILY_CAP
        value: "150"
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: LLM_API_KEY
        sync: false
