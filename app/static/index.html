<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GitContext</title>
<style>
:root{--bg:#fff;--fg:#1a1a2e;--mut:#6b7280;--card:#f3f4f8;--acc:#4f46e5;--ok:#16a34a}
@media(prefers-color-scheme:dark){:root{--bg:#0f1117;--fg:#e5e7eb;--mut:#9ca3af;--card:#1a1d27;--acc:#818cf8;--ok:#4ade80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,sans-serif}
main{max-width:820px;margin:0 auto;padding:20px 16px 60px}h1{margin:.2em 0}h1 span{color:var(--acc)}
.sub{color:var(--mut);margin:0 0 18px}.row{display:flex;gap:8px;flex-wrap:wrap}
input,select,button{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--mut);background:var(--card);color:var(--fg)}
input{flex:1;min-width:200px}button{background:var(--acc);color:#fff;border:0;cursor:pointer}button:disabled{opacity:.6}
.card{background:var(--card);border-radius:12px;padding:14px;margin-top:14px}.mut{color:var(--mut);font-size:.85rem}
a.c{background:var(--acc);color:#fff;border-radius:6px;padding:0 6px;text-decoration:none;font-size:.8rem}
.src.cited{border-left:4px solid var(--ok)}pre{white-space:pre-wrap;overflow-x:auto;font-size:.8rem;margin:8px 0 0}
code{background:rgba(127,127,127,.2);padding:1px 5px;border-radius:4px}.err{color:#dc2626}
</style></head><body><main>
<h1>Git<span>Context</span></h1>
<p class="sub">Ask questions about the indexed repository. Answers cite their sources.</p>
<div class="row"><input id="q" placeholder="How does Flask match a URL to a view function?" autofocus>
<select id="mode"><option value="rerank">rerank</option><option value="hybrid">hybrid</option>
<option value="bm25">bm25</option><option value="vector">vector</option></select>
<button id="go">Ask</button></div>
<div id="out"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
 .replace(/^\* /gm,'• ').replace(/\[(\d+)\]/g,'<a class="c" href="#s$1">$1</a>').replace(/\n/g,'<br>');
async function ask(){
  const question=$('q').value.trim(); if(question.length<3) return;
  $('go').disabled=true; $('out').innerHTML='<div class="card mut">Searching and thinking...</div>';
  try{
    const r=await fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({question,mode:$('mode').value})});
    const d=await r.json(); if(!r.ok) throw new Error(d.detail||JSON.stringify(d));
    $('out').innerHTML='<div class="card">'+fmt(d.answer)+'<div class="mut" style="margin-top:10px">retrieval '
      +d.retrieval_ms+' ms · total '+d.total_ms+' ms</div></div><h3>Sources</h3>'
      +d.sources.map(s=>'<div class="card src '+(s.cited?'cited':'')+'" id="s'+s.n+'"><b>['+s.n+'] '+esc(s.label)
      +'</b><div class="mut">'+esc(s.kind)+' · '+esc(s.author)+' · '+esc(s.date)+' · score '+s.score
      +(s.cited?' · cited':'')+'</div><pre>'+esc(s.snippet)+'</pre></div>').join('');
  }catch(e){$('out').innerHTML='<div class="card err">'+esc(e.message)+'</div>';}
  $('go').disabled=false;
}
$('go').onclick=ask; $('q').onkeydown=e=>{if(e.key==='Enter')ask()};
</script></main></body></html>
